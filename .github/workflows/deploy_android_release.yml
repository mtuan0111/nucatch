name: Android Production Deployment

on:
  push:
    branches:
      - deployment_production
      - deployment_production_android

env:
  ENV_TRACK: production # Production release track
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64_PRD }}
  KEY_PROPERTIES_BASE64: ${{ secrets.KEY_PROPERTIES_BASE64_PRD }}
  SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.SERVICE_ACCOUNT_JSON_BASE64_PRD }}
  ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME_PRD }}
  KEYSTORE_FILE_NAME: ${{ vars.KEYSTORE_FILE_NAME_PRD }}.jks # Nusaresearch

jobs:
  deploy-production:
    runs-on: macos-26
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: 🔢 Load version configuration
        id: version
        run: |
          # Load from config file
          VERSION_NAME=$(jq -r '.android.prod.versionName' .github/config/version-config.json)
          VERSION_CODE=$(jq -r '.android.prod.versionCode' .github/config/version-config.json)

          # Allow manual override
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            IFS=',' read -r VERSION_NAME VERSION_CODE <<< "${{ github.event.inputs.version_override }}"
            echo "⚠️  Using version override: $VERSION_NAME ($VERSION_CODE)"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

          echo "=== Version Information ==="
          echo "Version Name: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"

      - name: 📝 Load release notes
        id: release_notes
        run: |
          echo "=== Generating Release Notes for All Languages ==="
          mkdir -p distribution/whatsnew

          # Get all language keys from releaseNotes
          LANGUAGES=$(jq -r '.android.prod.releaseNotes | keys[]' .github/config/version-config.json)

          # Generate release notes file for each language
          for LANG in $LANGUAGES; do
            NOTES=$(jq -r ".android.prod.releaseNotes[\"$LANG\"]" .github/config/version-config.json)
            echo "$NOTES" > "distribution/whatsnew/$LANG.txt"
            echo "✅ Generated release notes for $LANG:"
            cat "distribution/whatsnew/$LANG.txt"
            echo ""
          done

          echo "✅ Release notes generated for all languages: $LANGUAGES"

      - name: 🔍 Check if app bundle exists in Google Play
        id: check_build
        run: |
          set +e  # Don't exit on error, we'll handle errors manually

          echo "=== Checking if App Bundle Exists in Google Play ==="
          echo "Checking for version ${{ steps.version.outputs.VERSION_NAME }} (${{ steps.version.outputs.VERSION_CODE }}) across all tracks..."

          # Decode service account JSON
          mkdir -p /tmp/gcp
          echo "$SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > /tmp/gcp/service_account.json

          # Verify service account file
          if [ ! -f /tmp/gcp/service_account.json ]; then
            echo "❌ ERROR: Failed to create service account file"
            exit 1
          fi

          echo "✅ Service account file created successfully"

          # Install dependencies for Python script
          echo "Installing Python dependencies..."
          python3 -m pip install --quiet --user google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client 2>/dev/null || \
          python3 -m pip install --quiet --break-system-packages google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client 2>/dev/null || {
            echo "⚠️ Failed to install Python dependencies"
            rm -rf /tmp/gcp
            exit 1
          }

          # Run the promote or build check script
          ACTION=$(python3 .github/workflows/promote_or_build_android.py \
            "${{ env.ANDROID_PACKAGE_NAME }}" \
            "${{ steps.version.outputs.VERSION_CODE }}" \
            "${{ steps.version.outputs.VERSION_NAME }}" \
            "/tmp/gcp/service_account.json")

          CHECK_EXIT_CODE=$?

          # Cleanup
          rm -rf /tmp/gcp

          if [ $CHECK_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "⚠️ Check failed, defaulting to BUILD"
            ACTION="BUILD"
          fi

          echo "ACTION=$ACTION" >> $GITHUB_OUTPUT
          echo ""
          echo "=== Decision: $ACTION ==="
          if [ "$ACTION" = "PROMOTE" ]; then
            echo "📦 App bundle found in Google Play - will PROMOTE to production"
          else
            echo "🔨 App bundle not found in any track - will BUILD from scratch and upload to production"
          fi
        env:
          SERVICE_ACCOUNT_JSON_BASE64: ${{ env.SERVICE_ACCOUNT_JSON_BASE64 }}

      # ========== PROMOTE PATH: If app bundle exists in any track ==========
      - name: 📤 Promote to Production
        if: steps.check_build.outputs.ACTION == 'PROMOTE'
        run: |
          echo "=== Promoting Build from Internal to Production ==="

          # Decode service account JSON
          echo "$SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > /tmp/service_account.json

          # Install dependencies
          python3 -m pip install --quiet --user google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client 2>/dev/null || \
          python3 -m pip install --quiet --break-system-packages google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client 2>/dev/null

          # Create promotion script
          cat > /tmp/promote_to_production.py << 'PROMOTE_SCRIPT'
          #!/usr/bin/env python3
          import sys
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          def promote_to_production(package_name, version_code, service_account_path, whatsnew_dir):
              print(f"=== Promoting Version {version_code} to Production ===")
              print(f"Package: {package_name}")
              
              # Authenticate
              credentials = service_account.Credentials.from_service_account_file(
                  service_account_path,
                  scopes=['https://www.googleapis.com/auth/androidpublisher']
              )
              service = build('androidpublisher', 'v3', credentials=credentials)
              
              # Create edit session
              print("Creating edit session...")
              edit_result = service.edits().insert(body={}, packageName=package_name).execute()
              edit_id = edit_result['id']
              print(f"✅ Edit session: {edit_id}")
              
              # Load release notes from whatsnew directory
              release_notes = {}
              if os.path.exists(whatsnew_dir):
                  for filename in os.listdir(whatsnew_dir):
                      if filename.endswith('.txt'):
                          lang = filename.replace('.txt', '')
                          with open(os.path.join(whatsnew_dir, filename), 'r') as f:
                              release_notes[lang] = f.read().strip()
                          print(f"✅ Loaded release notes for {lang}")
              
              # Format release notes for API
              release_notes_list = [{'language': lang, 'text': text} for lang, text in release_notes.items()]
              
              # Update production track with the version code from internal
              print(f"\nUpdating production track with version code {version_code}...")
              
              track_body = {
                  'track': 'production',
                  'releases': [{
                      'versionCodes': [str(version_code)],
                      'status': 'completed',
                      'releaseNotes': release_notes_list
                  }]
              }
              
              service.edits().tracks().update(
                  packageName=package_name,
                  editId=edit_id,
                  track='production',
                  body=track_body
              ).execute()
              
              print("✅ Production track updated")
              
              # Commit the changes
              print("\nCommitting changes...")
              service.edits().commit(packageName=package_name, editId=edit_id).execute()
              print("✅ Changes committed successfully!")
              
              print(f"\n{'='*60}")
              print(f"✅ Successfully promoted version {version_code} to production!")
              print(f"{'='*60}")
              
              return 0

          if __name__ == '__main__':
              package_name = sys.argv[1]
              version_code = int(sys.argv[2])
              service_account_path = sys.argv[3]
              whatsnew_dir = sys.argv[4]
              
              sys.exit(promote_to_production(package_name, version_code, service_account_path, whatsnew_dir))
          PROMOTE_SCRIPT

          # Run promotion
          python3 /tmp/promote_to_production.py \
            "${{ env.ANDROID_PACKAGE_NAME }}" \
            "${{ steps.version.outputs.VERSION_CODE }}" \
            "/tmp/service_account.json" \
            "distribution/whatsnew"

          PROMOTE_EXIT_CODE=$?

          # Cleanup
          rm -f /tmp/service_account.json
          rm -f /tmp/promote_to_production.py

          if [ $PROMOTE_EXIT_CODE -ne 0 ]; then
            echo "❌ Promotion failed!"
            exit 1
          fi

          echo "✅ Promotion completed successfully!"
        env:
          SERVICE_ACCOUNT_JSON_BASE64: ${{ env.SERVICE_ACCOUNT_JSON_BASE64 }}

      # ========== BUILD PATH: If build doesn't exist, build from scratch ==========
      - name: Set up Flutter
        if: steps.check_build.outputs.ACTION == 'BUILD'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: false # Disable cache to ensure fresh dependencies

      - name: Disable Flutter analytics
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: flutter config --no-analytics

      - name: Precache iOS dependencies
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: flutter precache --ios

      - name: Clear pub cache (fix super_tooltip conflict)
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: |
          echo "=== Clearing pub cache to fix dependency conflicts ==="
          flutter pub cache clean
          echo "✅ Pub cache cleared"

      - name: Decode keystore
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ env.KEYSTORE_FILE_NAME }}
          echo "$KEY_PROPERTIES_BASE64" | base64 -d > android/keystore.properties
          echo "$SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > android/service_account.json

          echo "Firebase CLI authenticate with key ID: $(jq -r .client_id android/service_account.json)"

          # Debug information
          ls -al

          ls -al android

          # validate decode file
          echo "Validate decode file:"
          cat android/service_account.json
          cat android/keystore.properties
          cat ${{ env.KEYSTORE_FILE_NAME }}

        env:
          KEYSTORE_BASE64: ${{ env.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_BASE64: ${{ env.KEY_PROPERTIES_BASE64 }}
          SERVICE_ACCOUNT_JSON_BASE64: ${{ env.SERVICE_ACCOUNT_JSON_BASE64 }}

      - name: Verify Keystore Credentials
        run: |
          # Replace 'key.jks' with the exact path your decode step uses

          # read the alias, storepass, keypass from keystore.properties

          export KEYSTORE_ALIAS=
          export KEYSTORE_STOREPASS=
          export KEYSTORE_KEYPASS=

          while IFS='=' read -r key value; do
            if [ "$key" = "key.keyAlias" ]; then
              KEYSTORE_ALIAS="$value"
              if [ -z "$KEYSTORE_ALIAS" ]; then
                echo "KEYSTORE_ALIAS not found"
              fi
            fi
            if [ "$key" = "key.storePassword" ]; then
              KEYSTORE_STOREPASS="$value"
              if [ -z "$KEYSTORE_STOREPASS" ]; then
                echo "KEYSTORE_STOREPASS not found"
              fi
            fi
            if [ "$key" = "key.keyPassword" ]; then
              KEYSTORE_KEYPASS="$value"
              if [ -z "$KEYSTORE_KEYPASS" ]; then
                echo "KEYSTORE_KEYPASS not found"
              fi
            fi
          done < key.properties

          echo "KEYSTORE_ALIAS: $KEYSTORE_ALIAS"
          echo "KEYSTORE_STOREPASS: $KEYSTORE_STOREPASS"
          echo "KEYSTORE_KEYPASS: $KEYSTORE_KEYPASS"

          keytool -list -v \
            -keystore key.jks \
            -alias "$KEYSTORE_ALIAS" \
            -storepass "$KEYSTORE_STOREPASS" \
            -keypass "$KEYSTORE_KEYPASS"

      - name: Setup SSH for private repos
        if: steps.check_build.outputs.ACTION == 'BUILD'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Get Flutter dependencies
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: |
          flutter pub get

      - name: Install Firebase CLI and FlutterFire CLI
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: |
          # Install Firebase CLI using Node.js package manager
          npm install -g firebase-tools
          # Install FlutterFire CLI
          dart pub global activate flutterfire_cli
          # Verify installations
          firebase --version
          flutterfire --version

      - name: Authenticate Firebase CLI
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: |
          echo "Firebase CLI authenticate with key ID: $(jq -r .client_id android/service_account.json)"
          firebase projects:list
          if firebase projects:list 2>&1 | grep -q "Project ID"; then
            echo "✅ Firebase CLI authenticated successfully"
            echo "   Key ID: $(jq -r .client_id android/service_account.json)"
          else
            echo "❌ ERROR: Firebase CLI authentication failed"
            echo "   Key ID: $(jq -r .client_id android/service_account.json)"
            exit 1
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: android/service_account.json

      - name: Build appbundle (prod flavor)
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: |
          echo "=== Building Android App Bundle ==="
          echo "Building version: ${{ steps.version.outputs.VERSION_NAME }} (${{ steps.version.outputs.VERSION_CODE }})"

          export PATH=$PATH:$HOME/.pub-cache/bin
          export GOOGLE_APPLICATION_CREDENTIALS="android/service_account.json"
          # Generate Firebase configuration with FlutterFire
          npm run flutterfire_setup
          npm run refresh && flutter build appbundle \
            --build-name=${{ steps.version.outputs.VERSION_NAME }} \
            --build-number=${{ steps.version.outputs.VERSION_CODE }} \
            --release \
            --dart-define=APP_ENVIRONMENT=PRODUCTION

          # Verify build outputs
          echo ""
          echo "=== Build Verification ==="
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ AAB file generated successfully"
            ls -lh build/app/outputs/bundle/release/app-release.aab
          else
            echo "❌ ERROR: AAB file not found"
            exit 1
          fi

          # Check for mapping file
          if [ -f "build/app/outputs/mapping/release/mapping.txt" ]; then
            echo "✅ Mapping file generated successfully"
            ls -lh build/app/outputs/mapping/release/mapping.txt
          else
            echo "⚠️ WARNING: Mapping file not found, creating empty one for compatibility"
            mkdir -p build/app/outputs/mapping/release
            touch build/app/outputs/mapping/release/mapping.txt
            echo "# No obfuscation mapping available" > build/app/outputs/mapping/release/mapping.txt
            echo "✅ Created placeholder mapping file"
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: android/service_account.json
          FIREBASE_TOKEN: ${{ env.FIREBASE_TOKEN }}

      - name: 📋 Check mapping file existence
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: |
          MAPPING_PATH="build/app/outputs/mapping/release/mapping.txt"
          if [ -f "build/app/outputs/mapping/release/mapping.txt" ]; then
            echo "MAPPING_EXISTS=true" >> $GITHUB_ENV
            echo "MAPPING_FILE_PATH=$MAPPING_PATH" >> $GITHUB_ENV
            echo "✅ Mapping file exists and will be uploaded"
            echo "   Path: $MAPPING_PATH"
          else
            echo "MAPPING_EXISTS=false" >> $GITHUB_ENV
            echo "MAPPING_FILE_PATH=" >> $GITHUB_ENV
            echo "⚠️ WARNING: Mapping file does not exist, upload will proceed without it"
          fi

      - name: 📋 Verify Service Account Details
        if: steps.check_build.outputs.ACTION == 'BUILD'
        run: |
          echo "=== Service Account Information ==="
          echo "Service Account Email: $(jq -r .client_email android/service_account.json)"
          echo "Project ID: $(jq -r .project_id android/service_account.json)"
          echo "Package Name: ${{ env.ANDROID_PACKAGE_NAME }}"
          echo ""
          echo "ℹ️ If you get a permission error, ensure:"
          echo "   1. This service account is invited in Google Play Console"
          echo "   2. It has 'Admin' or at least 'Release Manager' role"
          echo "   3. The package name matches your app in Play Console"

      - name: 📦 Upload to Google Play Production
        if: steps.check_build.outputs.ACTION == 'BUILD'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: android/service_account.json
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ env.ENV_TRACK }}
          status: completed
          inAppUpdatePriority: 2
          changesNotSentForReview: false
          whatsNewDirectory: distribution/whatsnew
          mappingFile: ${{ env.MAPPING_FILE_PATH }}

      # ========== SUMMARY ==========
      - name: 📊 Build Summary
        if: success()
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║            ANDROID DEPLOYMENT SUMMARY                          ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "✅ Status: Successfully Deployed"
          echo "📱 Platform: Android"
          echo "🏷️  Version: ${{ steps.version.outputs.VERSION_NAME }} (Build ${{ steps.version.outputs.VERSION_CODE }})"
          echo "🎯 Distribution: Google Play - ${{ env.ENV_TRACK }} Track"
          echo "📋 Action: ${{ steps.check_build.outputs.ACTION }}"
          if [ "${{ steps.check_build.outputs.ACTION }}" = "PROMOTE" ]; then
            echo "   → Promoted existing app bundle to production"
          else
            echo "   → Built from scratch and uploaded"
          fi
          echo "⏰ Build Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo ""
          echo "📝 Release Notes:"
          for file in distribution/whatsnew/*.txt; do
            if [ -f "$file" ]; then
              lang=$(basename "$file" .txt)
              echo "   [$lang]: $(cat "$file")"
            fi
          done
          echo ""
          echo "📋 What's Next:"
          echo "   • Build is now available in Google Play Console"
          echo "   • Production users will receive the update"
          echo "   • Check Google Play Console for deployment status"
          echo "   • Monitor crash reports and performance metrics"
          echo ""
          echo "🔗 Links:"
          echo "   • Google Play Console: https://play.google.com/console"
          echo ""

      - name: 🧹 Cleanup sensitive files
        if: always()
        run: |
          echo "=== Cleaning Up Sensitive Files ==="
          rm -f android/${{ env.KEYSTORE_FILE_NAME }}
          rm -f android/keystore.properties
          rm -f android/service_account.json
          rm -f /tmp/service_account.json
          rm -f /tmp/promote_to_production.py
          echo "✅ Sensitive files cleaned up"
