name: nucatch
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.0+30

environment:
  sdk: '>=3.2.5 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  
  intl: any


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.4
  font_awesome_flutter: ^10.7.0
  timer_count_down: ^2.2.2
  lunar: ^1.7.8
  
  
  package_info_plus: ^8.3.0
  shared_preferences: ^2.2.3
  uuid: ^4.5.1
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  sqflite: ^2.4.1
  vibration: ^3.1.3
  audioplayers: ^5.2.1
  share_plus: ^7.2.2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.12
  flutter_launcher_icons: ^0.14.3
  path: ^1.9.0
  path_provider: ^2.1.5
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  cloud_firestore: ^6.0.3
  # nearby_connections: ^4.3.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  super_tooltip: ^2.0.8
  # Shared BLE Platform Services (includes flutter_reactive_ble and ble_peripheral)
  ble_plat_services:
    path: ../ble_plat_services


dependency_overrides:
  win32: ^5.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/sounds/
    - .env
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Baloo Bhai
      fonts:
        - asset: assets/fonts/Baloo_Bhai_2/BalooBhai2-Regular.ttf
        - asset: assets/fonts/Baloo_Bhai_2/BalooBhai2-Medium.ttf
          weight: 300
        - asset: assets/fonts/Baloo_Bhai_2/BalooBhai2-SemiBold.ttf
          weight: 500
        - asset: assets/fonts/Baloo_Bhai_2/BalooBhai2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo_Bhai_2/BalooBhai2-ExtraBold.ttf
          weight: 900
          style: italic

    - family: Charmonman
      fonts:
        - asset: assets/fonts/Charmonman/Charmonman-Regular.ttf
          weight: 300
        - asset: assets/fonts/Charmonman/Charmonman-Bold.ttf
          weight: 500

    - family: Dancing Script
      fonts:
        - asset: assets/fonts/Dancing_Script/DancingScript-VariableFont_wght.ttf

    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/Roboto_Mono/RobotoMono-VariableFont_wght.ttf

    - family: Xanh Mono
      fonts:
        - asset: assets/fonts/Xanh_Mono/XanhMono-Regular.ttf
        - asset: assets/fonts/Xanh_Mono/XanhMono-Italic.ttf
          style: italic

    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrains_Mono/static/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrains_Mono/static/JetBrainsMono-Medium.ttf
          weight: 300
        - asset: assets/fonts/JetBrains_Mono/static/JetBrainsMono-SemiBold.ttf
          weight: 500
        - asset: assets/fonts/JetBrains_Mono/static/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrains_Mono/static/JetBrainsMono-ExtraBold.ttf
          weight: 900
          style: italic

    - family: Inter
      fonts:
        # - asset: assets/fonts/Inter/Inter-VariableFont_slnt,wght.ttf
        # - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Black.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-BlackItalic.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Bold.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-BoldItalic.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-ExtraBold.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-ExtraBoldItalic.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-ExtraLight.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-ExtraLightItalic.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Italic.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Light.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-LightItalic.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-MediumItalic.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBold.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBoldItalic.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Thin.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-ThinItalic.ttf
        - asset: assets/fonts/Inter/static/Inter_24pt-Black.ttf
        - asset: assets/fonts/Inter/static/Inter_24pt-BlackItalic.ttf
        - asset: assets/fonts/Inter/static/Inter_24pt-Bold.ttf
