flutter_launcher_icons:
  # android: true
  # ios: true
  image_path: "assets/images/nuCatch-icon.png"
  # # adaptive_icon_background: "assets/images/launcher-background.png"
  image_path_android: "assets/images/nuCatch-launcher-512.png"
  image_path_ios: "assets/images/nuCatch-launcher-512.png"
  adaptive_icon_background: "#ffffff"

  android: "launcher_icon"
  ios: true # can specify file name here e.g. "My-Launcher-Icon"
  # adaptive_icon_background: "assets/images/launcher-background.png" # only available for Android 8.0 devices and above
  # adaptive_icon_foreground: "assets/images/nuCatch-icon.png" # only available for Android 8.0 devices and above
  # Execute query: flutter pub run flutter_launcher_icons:main
  remove_alpha_ios: true